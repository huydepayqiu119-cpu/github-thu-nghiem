name: Cleanup
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup old remove runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOOLS_PAT }}
          script: |
            for (const workflow_id of ['hide-url.yml', 'remove.yml', 'conversion-request.yml', 'cleanup.yml']) {
              let page = 1;
              while (true) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  status: 'completed',
                  per_page: 100,
                  page
                });
                if (runs.data.workflow_runs.length === 0) break;
                for (const run of runs.data.workflow_runs) {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  }).catch(() => {});
                }
                if (runs.data.workflow_runs.length < 100) break;
                page++;
              }
            }
